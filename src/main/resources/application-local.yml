spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/java_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: rabbit
    password: rabbit
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/local
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mall:
  order:
    expire-minutes: 30
  cache:
    product-ttl: 10m
  message:
    outbox-batch-size: 100
  job:
    fixed-delay-ms: 30000
